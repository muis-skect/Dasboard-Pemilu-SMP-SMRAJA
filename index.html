<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem E-Voting Pemira</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #eef2f5; padding: 20px; margin: 0; }
    .card { background: white; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-bottom: 20px; }
    .step-indicator { font-weight: bold; color: #0275d8; font-size: 1.1em; background: #e7f1ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 15px; }
    
    /* Grid Tombol Pilihan */
    .option-container { display: none; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
    .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn-option { background: #007bff; color: white; border: none; padding: 12px 15px; font-size: 1em; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-option:hover { background: #0056b3; }
    .btn-dps { background: #28a745; }
    .btn-dps:hover { background: #1e7e34; }
    .btn-back { background: #6c757d; margin-top: 10px; }
    
    .info-box { margin-top: 20px; text-align: left; background: #f8f9fa; padding: 12px 15px; border-radius: 8px; font-size: 0.95em; }
    .status-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>E-Voting Pemira Online</h2>
    <div id="stepText" class="step-indicator">Langkah 1: Scan QR Code Pemilih Anda</div>
    
    <!-- Area Kamera Scanner -->
    <div id="reader"></div>

    <!-- 1. Menu Pilihan Ketua & Wakil -->
    <div id="ketuaOptions" class="option-container">
      <button class="btn-option" onclick="selectKetua('Paslon 01')">Paslon 01 - Ketua A & Wakil A</button>
      <button class="btn-option" onclick="selectKetua('Paslon 02')">Paslon 02 - Ketua B & Wakil B</button>
      <button class="btn-option" onclick="selectKetua('Paslon 03')">Paslon 03 - Ketua C & Wakil C</button>
    </div>

    <!-- 2. Menu Pilih Kelas DPS -->
    <div id="dpsKelasOptions" class="option-container">
      <p style="margin:0 0 10px 0; font-weight:bold;">Pilih Tingkat Kelas DPS:</p>
      <button class="btn-option btn-dps" onclick="showDpsKandidat('7')">Kelas VII (7)</button>
      <button class="btn-option btn-dps" onclick="showDpsKandidat('8')">Kelas VIII (8)</button>
      <button class="btn-option btn-dps" onclick="showDpsKandidat('9')">Kelas IX (9)</button>
    </div>

    <!-- 3. Sub-Menu Kandidat DPS per Kelas -->
    <!-- Kelas VII (6 DPS) -->
    <div id="dpsKandidat7" class="option-container">
      <p style="margin:0 0 10px 0; font-weight:bold;">Pilih DPS Kelas VII:</p>
      <div class="grid-options">
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VII - 01')">DPS VII - 01</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VII - 02')">DPS VII - 02</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VII - 03')">DPS VII - 03</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VII - 04')">DPS VII - 04</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VII - 05')">DPS VII - 05</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VII - 06')">DPS VII - 06</button>
      </div>
      <button class="btn-option btn-back" onclick="backToKelas()">← Kembali Pilih Kelas</button>
    </div>

    <!-- Kelas VIII (10 DPS) -->
    <div id="dpsKandidat8" class="option-container">
      <p style="margin:0 0 10px 0; font-weight:bold;">Pilih DPS Kelas VIII:</p>
      <div class="grid-options">
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 01')">DPS VIII - 01</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 02')">DPS VIII - 02</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 03')">DPS VIII - 03</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 04')">DPS VIII - 04</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 05')">DPS VIII - 05</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 06')">DPS VIII - 06</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 07')">DPS VIII - 07</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 08')">DPS VIII - 08</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 09')">DPS VIII - 09</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas VIII - 10')">DPS VIII - 10</button>
      </div>
      <button class="btn-option btn-back" onclick="backToKelas()">← Kembali Pilih Kelas</button>
    </div>

    <!-- Kelas IX (10 DPS) -->
    <div id="dpsKandidat9" class="option-container">
      <p style="margin:0 0 10px 0; font-weight:bold;">Pilih DPS Kelas IX:</p>
      <div class="grid-options">
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 01')">DPS IX - 01</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 02')">DPS IX - 02</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 03')">DPS IX - 03</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 04')">DPS IX - 04</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 05')">DPS IX - 05</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 06')">DPS IX - 06</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 07')">DPS IX - 07</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 08')">DPS IX - 08</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 09')">DPS IX - 09</button>
        <button class="btn-option btn-dps" onclick="selectDPS('DPS Kelas IX - 10')">DPS IX - 10</button>
      </div>
      <button class="btn-option btn-back" onclick="backToKelas()">← Kembali Pilih Kelas</button>
    </div>

    <!-- Ringkasan Pilihan -->
    <div class="info-box">
      <p style="margin: 5px 0;"><b>ID Pemilih:</b> <span id="valPemilih" style="color:#0275d8;">-</span></p>
      <p style="margin: 5px 0;"><b>Pilihan Ketua:</b> <span id="valKetua" style="color:#0275d8;">-</span></p>
      <p style="margin: 5px 0;"><b>Pilihan DPS:</b> <span id="valDPS" style="color:#0275d8;">-</span></p>
    </div>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://docs.google.com/spreadsheets/d/1kbQzS8UcrAgSb7P0HyyMEiofO7CWK1eLs68vRBowj28/edit?gid=0#gid=0c";

    let step = 1;
    let voteData = { idPemilih: "", pilihanKetua: "", pilihanDPS: "" };
    let html5QrcodeScanner;

    function hideAllMenus() {
      document.getElementById("ketuaOptions").style.display = "none";
      document.getElementById("dpsKelasOptions").style.display = "none";
      document.getElementById("dpsKandidat7").style.display = "none";
      document.getElementById("dpsKandidat8").style.display = "none";
      document.getElementById("dpsKandidat9").style.display = "none";
    }

    function showStatus(msg, isSuccess) {
      const box = document.getElementById("statusBox");
      box.innerText = msg;
      box.className = "status-box " + (isSuccess ? "success" : "error");
      box.style.display = "block";
    }

    function onScanSuccess(decodedText) {
      if (step === 1) {
        voteData.idPemilih = decodedText;
        document.getElementById("valPemilih").innerText = decodedText;
        step = 2;
        document.getElementById("stepText").innerText = "Langkah 2: Scan QR Code Kategori Ketua & Wakil";
      } else if (step === 2) {
        document.getElementById("reader").style.display = "none";
        document.getElementById("ketuaOptions").style.display = "flex";
        document.getElementById("stepText").innerText = "Pilih Paslon Ketua & Wakil";
      } else if (step === 3) {
        document.getElementById("reader").style.display = "none";
        document.getElementById("dpsKelasOptions").style.display = "flex";
        document.getElementById("stepText").innerText = "Pilih Tingkat Kelas DPS";
      }
    }

    function selectKetua(pilihan) {
      voteData.pilihanKetua = pilihan;
      document.getElementById("valKetua").innerText = pilihan;
      hideAllMenus();
      document.getElementById("reader").style.display = "block";
      step = 3;
      document.getElementById("stepText").innerText = "Langkah 3: Scan QR Code Kategori DPS";
    }

    function showDpsKandidat(kelas) {
      hideAllMenus();
      document.getElementById("dpsKandidat" + kelas).style.display = "flex";
      document.getElementById("stepText").innerText = "Pilih Kandidat DPS Kelas " + (kelas === '7' ? 'VII' : kelas === '8' ? 'VIII' : 'IX');
    }

    function backToKelas() {
      hideAllMenus();
      document.getElementById("dpsKelasOptions").style.display = "flex";
      document.getElementById("stepText").innerText = "Pilih Tingkat Kelas DPS";
    }

    function selectDPS(pilihan) {
      voteData.pilihanDPS = pilihan;
      document.getElementById("valDPS").innerText = pilihan;
      hideAllMenus();
      
      if(html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }
      
      document.getElementById("stepText").innerText = "Mengirim Suara ke Database...";
      submitVote();
    }

    function submitVote() {
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(voteData)
      })
      .then(res => res.json())
      .then(response => {
        if(response.status === "success") {
          showStatus("Suara Anda berhasil disimpan! Terima kasih.", true);
          setTimeout(() => { location.reload(); }, 3000);
        } else {
          showStatus("Gagal: " + response.message, false);
          setTimeout(() => { location.reload(); }, 4000);
        }
      })
      .catch(err => {
        showStatus("Terjadi kesalahan koneksi internet.", false);
        setTimeout(() => { location.reload(); }, 4000);
      });
    }

    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
